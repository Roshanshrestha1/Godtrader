supported_timeframes: ["1m", "5m", "15m", "1h", "4h", "1d"]

# Master Brain thresholds - Aggressive Settings
master_brain:
  min_agents_agree: 3         # Lowered from 4 (allows 3/5 consensus for Tier 2 signals)
  min_confidence: 60          # Lowered from 65 to catch more opportunities
  agent5_veto_enabled: false  # Disabled hard veto - Agent 5 now reduces position size instead
