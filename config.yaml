# Aggressive Trading Analysis System Configuration
# Optimized for finding more trade opportunities

analysis:
  main_timeframe: "1h"
  entry_timeframe: "15m"      # Lowered from 5m to find more entries
  adx_threshold: 18            # Lowered from 25 to catch trend starts earlier
  ema_period: 200
  volume_sma_period: 20
  sweep_lookback_hours: 24
  
risk:
  default_stop_atr_multiplier: 2.0  # Wider SL (was 1.5) - gives trade room to breathe
  default_target_atr_multiplier: 3.0
  max_volatility_pct: 10.0          # Allows trading more volatile pairs (was 5.0)
  
data:
  max_staleness_seconds: 120
  retry_attempts: 3
  retry_backoff_base: 1.0
  
output:
  log_file: "signals.log"
  verbose: true

# Telegram Bot Configuration
telegram:
  # Bot token will be loaded from environment variable TELEGRAM_BOT_TOKEN
  admin_user_ids: []  # Add your Telegram user ID(s) here for access control

